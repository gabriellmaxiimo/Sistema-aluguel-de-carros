spring.application.name=aluguel-carros
# Lê variáveis do arquivo .env (formato chave=valor), se existir
spring.config.import=optional:file:.env[.properties]

# Supabase (PostgreSQL) - ver .env.example
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
# Pooler do Supabase (plano gratuito) aceita 15 conexões no total; o padrão do Hikari (10) esgota com 2 instâncias
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

server.port=${SERVER_PORT:8080}
server.error.include-message=always

app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
